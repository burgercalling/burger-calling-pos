services:
  - type: web
    name: burger-calling-pos-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: COOKIE_NAME
        value: bc_access_token
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        sync: false
      - key: INITIAL_SUPERADMIN_USERNAME
        sync: false
      - key: INITIAL_SUPERADMIN_PASSWORD
        sync: false
      - key: UPLOAD_ROOT
        value: app/uploads
      - key: MAX_UPLOAD_SIZE
        value: "5242880"
      - key: ALLOWED_IMAGE_TYPES
        value: jpg,jpeg,png,webp
